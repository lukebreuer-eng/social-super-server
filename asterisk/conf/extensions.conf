[general]
static=yes
writeprotect=no

; Uitgaande gesprekken worden door de Social Engine opgezet via ARI en belanden
; in de Stasis-app. Die speelt het bericht af en vangt de toets op.
[uitgaand]
exten => _X.,1,NoOp(Uitgaand gesprek van de belbot naar ${EXTEN})
 same => n,Stasis(belbot)
 same => n,Hangup()

; Wie terugbelt naar het nummer van de bot krijgt netjes antwoord in plaats van
; een dode lijn.
[inkomend]
exten => _X.,1,NoOp(Inkomend op de belbot)
 same => n,Answer()
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
