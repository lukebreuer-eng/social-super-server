; Beveiliging: deze Asterisk staat NIET open voor het internet.
;
; Hij registreert UITGAAND bij de MiVoice Business en heeft daarom geen
; luisterende SIP-poort op een publiek adres nodig. Een SIP-poort op 0.0.0.0
; wordt binnen minuten gevonden door scanners (sipvicious en consorten) en dan
; regent het registratiepogingen op de MiVB. Dat risico nemen we niet.
;
; Drie lagen:
;   1. de transport bindt op het interne Docker-netwerk, niet op 0.0.0.0
;   2. type=identify accepteert uitsluitend verkeer van het MiVB-adres
;   3. er is geen endpoint voor anonieme bellers, dus onbekende bronnen krijgen
;      een 401 en komen nergens
;
; Publiceer in Coolify GEEN poorten voor deze container. De registratie houdt de
; NAT-sessie open waarover de MiVB terugpraat; daar is geen port mapping voor nodig.

[transport-udp]
type=transport
protocol=udp
; Alleen het interne containeradres. Wordt door het entrypoint ingevuld.
bind=__BIND_ADDR__:5060
; De MiVB moet weten waar hij media naartoe stuurt als we achter NAT zitten.
external_media_address=__EXTERN_IP__
external_signaling_address=__EXTERN_IP__
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[mivb-reg]
type=registration
transport=transport-udp
outbound_auth=mivb-auth
server_uri=sip:__SIP_HOST__
client_uri=sip:__SIP_USER__@__SIP_HOST__
retry_interval=60
; Na een fout wachtstand van tien minuten: bij een verkeerd wachtwoord blijven
; hameren levert een blokkade op de centrale op.
forbidden_retry_interval=600
fatal_retry_interval=600
expiration=3600

[mivb-auth]
type=auth
auth_type=userpass
username=__SIP_USER__
password=__SIP_PASS__

[mivb]
type=aor
contact=sip:__SIP_HOST__
qualify_frequency=60

[mivb]
type=endpoint
transport=transport-udp
context=uitgaand
disallow=all
; alaw eerst: dat is wat MiVB in Nederland standaard gebruikt
allow=alaw,ulaw
outbound_auth=mivb-auth
aors=mivb
from_user=__SIP_USER__
callerid=__SIP_CALLERID__ <__SIP_CALLERID__>
direct_media=no
; DTMF via RFC2833/4733, want daar leunt het toets-antwoord op
dtmf_mode=rfc4733
; Alleen deze auth accepteren voor inkomend verkeer van de centrale
auth=mivb-auth

[mivb]
type=identify
endpoint=mivb
; Uitsluitend de MiVoice Business mag zich als deze endpoint voordoen.
match=__SIP_HOST__
