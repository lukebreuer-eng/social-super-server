; Registratie als gewoon SIP-toestel op de MiVoice Business. Daardoor lopen
; uitgaande gesprekken via de bestaande routing en nummerweergave, en staan ze
; gewoon in de CDR van het contactcenter.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

[mivb]
type=registration
transport=transport-udp
outbound_auth=mivb-auth
server_uri=sip:__SIP_HOST__
client_uri=sip:__SIP_USER__@__SIP_HOST__
retry_interval=60
forbidden_retry_interval=600
expiration=3600

[mivb-auth]
type=auth
auth_type=userpass
username=__SIP_USER__
password=__SIP_PASS__

[mivb]
type=aor
contact=sip:__SIP_HOST__
qualify_frequency=60

[mivb]
type=endpoint
transport=transport-udp
context=uitgaand
disallow=all
; alaw eerst: dat is wat MiVB in Nederland standaard gebruikt
allow=alaw,ulaw
outbound_auth=mivb-auth
aors=mivb
from_user=__SIP_USER__
callerid=__SIP_CALLERID__ <__SIP_CALLERID__>
direct_media=no
; DTMF via RFC2833, want daar leunt het toets-antwoord op
dtmf_mode=rfc4733

[mivb]
type=identify
endpoint=mivb
match=__SIP_HOST__
