<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Theorie">
  <title>Miles' Theorie Sidekick</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #1a1f3a 0%, #2a1e3f 100%);
      color: #fff;
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #app {
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 16px) 16px;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: 800; font-size: 18px;
      letter-spacing: -0.3px;
    }
    .streak { font-size: 14px; opacity: 0.85; display: flex; align-items: center; gap: 4px; }
    .screen { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }

    h1 { font-size: 28px; margin: 0 0 8px 0; letter-spacing: -0.5px; }
    h2 { font-size: 20px; margin: 0 0 8px 0; letter-spacing: -0.3px; }
    p { line-height: 1.5; opacity: 0.92; }

    .btn {
      display: block; width: 100%;
      padding: 16px 18px;
      background: #FF6B35;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      margin-bottom: 10px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: rgba(255,255,255,0.1); }
    .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.2); }

    .cat-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 14px;
    }
    .cat-card:active { transform: scale(0.98); background: rgba(255,255,255,0.12); }
    .cat-icon { font-size: 32px; }
    .cat-info { flex: 1; }
    .cat-title { font-weight: 700; font-size: 16px; margin-bottom: 3px; }
    .cat-sub { font-size: 12px; opacity: 0.65; }
    .cat-score { font-weight: 700; font-size: 16px; }
    .score-low { color: #FF5252; }
    .score-mid { color: #FFC107; }
    .score-high { color: #00E676; }

    .progress-bar {
      display: flex; gap: 4px; margin-bottom: 16px;
    }
    .progress-dot {
      flex: 1; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.15);
    }
    .progress-dot.done { background: #00E676; }
    .progress-dot.wrong { background: #FF5252; }
    .progress-dot.current { background: rgba(255,255,255,0.5); }

    .vraag-wrap { flex: 1; display: flex; flex-direction: column; }
    .vraag-meta { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; opacity: 0.65; }
    .vraag-tekst { font-size: 18px; line-height: 1.5; margin-bottom: 16px; font-weight: 500; }
    .vraag-tekst .kernwoord {
      background: rgba(255,215,0,0.25);
      color: #FFD700;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 800;
    }

    .lees-prompt {
      background: linear-gradient(135deg, rgba(255,107,53,0.25), rgba(255,107,53,0.1));
      border: 1px solid rgba(255,107,53,0.4);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.45;
      display: flex; align-items: center; gap: 10px;
    }
    .lees-prompt-icon { font-size: 22px; flex-shrink: 0; }

    .denk-timer {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.7;
      text-align: center;
    }
    .denk-timer.green { color: #00E676; opacity: 1; font-weight: 600; }

    .antwoord-btn.locked {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    .snap-box {
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    .snap-box label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #FFD700;
    }
    .snap-box textarea {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 70px;
    }
    .snap-result {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      animation: fadeIn 0.3s;
    }
    .snap-result.snap { background: rgba(0, 230, 118, 0.18); border: 1px solid #00E676; }
    .snap-result.twijfel { background: rgba(255, 193, 7, 0.18); border: 1px solid #FFC107; }
    .snap-result.niet { background: rgba(255, 82, 82, 0.18); border: 1px solid #FF5252; }

    .visual {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex; align-items: center; justify-content: center;
      min-height: 140px;
    }
    .visual svg { max-width: 100%; max-height: 220px; }

    .antwoorden { display: flex; flex-direction: column; gap: 10px; }
    .antwoord-btn {
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      text-align: left;
      font-size: 15px;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .antwoord-btn:active { transform: scale(0.99); }
    .antwoord-btn:hover { background: rgba(255,255,255,0.12); }
    .antwoord-btn.correct {
      background: rgba(0,230,118,0.2);
      border-color: #00E676;
    }
    .antwoord-btn.wrong {
      background: rgba(255,82,82,0.2);
      border-color: #FF5252;
    }
    .antwoord-btn.disabled { pointer-events: none; opacity: 0.6; }
    .antwoord-btn.disabled.correct { opacity: 1; }
    .antwoord-btn.disabled.wrong { opacity: 1; }

    .feedback {
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .feedback-title { font-weight: 700; font-size: 17px; margin-bottom: 8px; }
    .feedback-uitleg { line-height: 1.5; opacity: 0.92; margin-bottom: 8px; }
    .ezelsbruggetje {
      background: rgba(255,215,0,0.12);
      border-left: 3px solid #FFD700;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }
    .ezelsbruggetje strong { color: #FFD700; }

    .summary { text-align: center; padding-top: 30px; }
    .summary-score {
      font-size: 64px; font-weight: 800; letter-spacing: -2px;
      margin: 18px 0; line-height: 1;
    }
    .summary-emoji { font-size: 56px; margin-bottom: 8px; }

    .small { font-size: 12px; opacity: 0.6; }
    .timer {
      position: fixed; top: max(env(safe-area-inset-top), 8px); right: 16px;
      background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 600; backdrop-filter: blur(10px);
    }
    .timer.warn { background: rgba(255,82,82,0.7); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="timer" class="timer" style="display:none">10:00</div>

  <script>
    const API = (location.hostname === 'localhost' || location.hostname.startsWith('192.'))
      ? 'http://localhost:3001/api/theorie'
      : 'https://api.ipaudio.nl/api/theorie';

    const app = document.getElementById('app');
    const state = {
      sessieId: null,
      streak: 0,
      vragenGedaan: [],
      huidigeVraag: null,
      huidigeVraagStart: null,
      categorie: 'mix',
      sessieStart: null,
      timerInterval: null,
      maxVragen: 10,
      mode: 'sessie', // 'sessie' = 10 vragen + feedback per vraag, 'examen' = 50 vragen zonder feedback
      examenAntwoorden: [], // bij examen-modus: alle gegeven antwoorden opslaan voor eindscore
    };

    const escHtml = (s) => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...opts.headers },
      });
      if (!res.ok) throw new Error((await res.json()).error || 'Network error');
      return res.json();
    }

    // ======= SCREENS =======

    function renderStart() {
      clearTimer();
      app.innerHTML = `
        <div class="header">
          <div class="logo">🛵 Theorie Sidekick</div>
          <div class="streak">🔥 ${state.streak}</div>
        </div>

        <div class="screen">
          <h1>Yo Miles 👋</h1>
          <p>Klaar voor een ronde? Kies een categorie. <strong>10 vragen of 10 minuten</strong> en je bent klaar voor je bakkie.</p>

          <div class="cat-card" data-cat="voorrang">
            <div class="cat-icon">🚦</div>
            <div class="cat-info">
              <div class="cat-title">Voorrang</div>
              <div class="cat-sub">Wie eerst? rechts is heilig...</div>
            </div>
            <div class="cat-score" id="score-voorrang">—</div>
          </div>

          <div class="cat-card" data-cat="verkeerstekens">
            <div class="cat-icon">🚸</div>
            <div class="cat-info">
              <div class="cat-title">Verkeerstekens</div>
              <div class="cat-sub">Borden + wat je moet doen</div>
            </div>
            <div class="cat-score" id="score-verkeerstekens">—</div>
          </div>

          <div class="cat-card" data-cat="gebruik_weg">
            <div class="cat-icon">🛣️</div>
            <div class="cat-info">
              <div class="cat-title">Gebruik van de weg</div>
              <div class="cat-sub">Snelheid, plaats, inhalen</div>
            </div>
            <div class="cat-score" id="score-gebruik_weg">—</div>
          </div>

          <div class="cat-card" data-cat="gevaarherkenning">
            <div class="cat-icon">⚠️</div>
            <div class="cat-info">
              <div class="cat-title">Gevaarherkenning</div>
              <div class="cat-sub">Wat kan hier gevaarlijk worden?</div>
            </div>
            <div class="cat-score" id="score-gevaarherkenning">—</div>
          </div>

          <div class="cat-card" data-cat="bijzondere">
            <div class="cat-icon">🛞</div>
            <div class="cat-info">
              <div class="cat-title">Bijzondere wegen</div>
              <div class="cat-sub">Rotonde, tunnel, fietsstraat</div>
            </div>
            <div class="cat-score" id="score-bijzondere">—</div>
          </div>

          <div class="cat-card" data-cat="wetgeving">
            <div class="cat-icon">⚖️</div>
            <div class="cat-info">
              <div class="cat-title">Wetgeving</div>
              <div class="cat-sub">Boetes, regels, papieren</div>
            </div>
            <div class="cat-score" id="score-wetgeving">—</div>
          </div>

          <div class="cat-card" data-cat="veilig">
            <div class="cat-icon">🛡️</div>
            <div class="cat-info">
              <div class="cat-title">Veilig rijden</div>
              <div class="cat-sub">Afstand, weer, helm, anticipatie</div>
            </div>
            <div class="cat-score" id="score-veilig">—</div>
          </div>

          <div class="cat-card" data-cat="mix" style="background:linear-gradient(135deg,rgba(255,107,53,0.25),rgba(255,107,53,0.1));border-color:rgba(255,107,53,0.5)">
            <div class="cat-icon">🎲</div>
            <div class="cat-info">
              <div class="cat-title">Mix — alles door elkaar</div>
              <div class="cat-sub">10 vragen, alle categorieën</div>
            </div>
            <div class="cat-score">→</div>
          </div>

          <div class="cat-card" id="btn-examen" style="background:linear-gradient(135deg,rgba(0,230,118,0.18),rgba(0,230,118,0.05));border-color:rgba(0,230,118,0.5)">
            <div class="cat-icon">🎓</div>
            <div class="cat-info">
              <div class="cat-title">Echt examen-simulatie</div>
              <div class="cat-sub">50 vragen, 30 min, geen feedback tot eind</div>
            </div>
            <div class="cat-score">→</div>
          </div>

          <div class="cat-card" id="btn-snap" style="background:linear-gradient(135deg,rgba(255,215,0,0.18),rgba(255,215,0,0.05));border-color:rgba(255,215,0,0.5)">
            <div class="cat-icon">🧠</div>
            <div class="cat-info">
              <div class="cat-title">Snap-check modus</div>
              <div class="cat-sub">Leg uit waarom je antwoord goed is — AI checkt of je 't snapt</div>
            </div>
            <div class="cat-score">→</div>
          </div>

          <div style="margin-top:24px">
            <button class="btn-ghost btn" id="btn-stats">📊 Mijn voortgang</button>
          </div>
        </div>
      `;
      document.querySelectorAll('.cat-card[data-cat]').forEach(c => c.addEventListener('click', () => startSessie(c.dataset.cat, 'sessie')));
      document.getElementById('btn-examen').addEventListener('click', () => {
        if (confirm('Examen-simulatie: 50 vragen in 30 min, GEEN feedback tussendoor. Net als echte CBR. Klaar?')) {
          startSessie('mix', 'examen');
        }
      });
      document.getElementById('btn-snap').addEventListener('click', () => {
        startSessie('mix', 'snap');
      });
      document.getElementById('btn-stats').addEventListener('click', renderStats);
      loadCategorieScores();
    }

    async function loadCategorieScores() {
      try {
        const stats = await api('/stats?gebruiker=miles');
        for (const cat of ['voorrang','verkeerstekens','gebruik_weg','gevaarherkenning','bijzondere','wetgeving','veilig']) {
          const el = document.getElementById('score-' + cat);
          if (!el) continue;
          const c = stats.per_categorie[cat];
          if (!c || c.totaal < 3) {
            el.textContent = '—';
            el.className = 'cat-score';
          } else {
            el.textContent = c.percentage + '%';
            el.className = 'cat-score ' + (c.percentage >= 86 ? 'score-high' : c.percentage >= 70 ? 'score-mid' : 'score-low');
          }
        }
      } catch (e) {}
    }

    async function startSessie(categorie, mode = 'sessie') {
      state.categorie = categorie;
      state.mode = mode;
      state.maxVragen = mode === 'examen' ? 50 : mode === 'snap' ? 8 : 10;
      state.vragenGedaan = [];
      state.examenAntwoorden = [];
      state.sessieStart = Date.now();
      try {
        const r = await api('/sessie/start', { method: 'POST', body: JSON.stringify({ gebruiker: 'miles', categorie }) });
        state.sessieId = r.sessie_id;
        state.streak = r.streak;
        startTimer();
        nextVraag();
      } catch (e) {
        alert('Oeps, kan niet starten: ' + e.message);
      }
    }

    function startTimer() {
      const timerEl = document.getElementById('timer');
      timerEl.style.display = 'block';
      const totalSec = state.mode === 'examen' ? 30*60 : state.mode === 'snap' ? 15*60 : 10*60;
      const update = () => {
        const left = totalSec - Math.floor((Date.now() - state.sessieStart) / 1000);
        if (left <= 0) { clearTimer(); finishSessie('time'); return; }
        const m = Math.floor(left/60), s = left % 60;
        timerEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
        timerEl.classList.toggle('warn', left <= 60);
      };
      update();
      state.timerInterval = setInterval(update, 1000);
    }
    function clearTimer() {
      if (state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = null;
      const t = document.getElementById('timer');
      if (t) t.style.display = 'none';
    }

    async function nextVraag() {
      if (state.vragenGedaan.length >= state.maxVragen) {
        finishSessie('count');
        return;
      }
      try {
        const exclude = state.vragenGedaan.map(v => v.id).join(',');
        const catParam = state.categorie === 'mix' ? '' : `&categorie=${state.categorie}`;
        const r = await api(`/volgende?gebruiker=miles&exclude=${exclude}${catParam}`);
        state.huidigeVraag = r.vraag;
        state.huidigeVraagStart = Date.now();
        renderVraag(r.vraag);
      } catch (e) {
        if (state.vragenGedaan.length > 0) finishSessie('count');
        else app.innerHTML = `<div class="card"><h2>Geen vragen meer</h2><p>${e.message}</p><button class="btn" onclick="location.reload()">Terug</button></div>`;
      }
    }

    function highlightKernwoorden(tekst) {
      // Markeer kritische woorden die de betekenis omkeren of beperken
      const woorden = ['NIET','BEHALVE','ALLEEN','ALTIJD','NOOIT','MOET','MAG','MINIMAAL','MAXIMAAL','VERPLICHT','VERBODEN','GEEN','GEDEELTELIJK'];
      let html = escHtml(tekst);
      woorden.forEach(w => {
        // case-insensitive, hele woord
        const re = new RegExp('\\b(' + w + '|' + w.toLowerCase() + '|' + w[0] + w.slice(1).toLowerCase() + ')\\b', 'g');
        html = html.replace(re, '<span class="kernwoord">$1</span>');
      });
      return html;
    }

    function renderVraag(v) {
      const progress = Array.from({length: state.maxVragen}, (_, i) => {
        if (i < state.vragenGedaan.length) {
          return state.vragenGedaan[i].correct ? 'done' : 'wrong';
        }
        if (i === state.vragenGedaan.length) return 'current';
        return '';
      }).map(c => `<div class="progress-dot ${c}"></div>`).join('');

      const catLabel = { voorrang: 'Voorrang', verkeerstekens: 'Verkeerstekens', gebruik_weg: 'Gebruik weg', bijzondere: 'Bijzondere wegen', wetgeving: 'Wetgeving', veilig: 'Veilig rijden', gevaarherkenning: 'Gevaarherkenning' }[v.categorie] || v.categorie;

      const isVisueel = v.visual_type && v.visual_type !== 'none';
      const leesPrompt = isVisueel
        ? `<div class="lees-prompt">
            <div class="lees-prompt-icon">🗣️</div>
            <div>
              <strong>Lees de vraag hardop voor jezelf.</strong> Wijs op het plaatje wie waar staat — neem rustig de tijd, dat helpt.
            </div>
          </div>`
        : '';

      app.innerHTML = `
        <div class="header">
          <div class="logo">🛵 ${state.vragenGedaan.length + 1}/${state.maxVragen}</div>
          <div class="streak">🔥 ${state.streak}</div>
        </div>
        <div class="progress-bar">${progress}</div>
        <div class="vraag-wrap screen">
          <div class="vraag-meta">
            <span>${catLabel}</span>
            <span>${'⭐'.repeat(v.moeilijkheid || 1)}</span>
          </div>
          ${leesPrompt}
          <div class="vraag-tekst">${highlightKernwoorden(v.vraag)}</div>
          ${isVisueel ? `<div class="visual">${renderVisual(v.visual_type, v.visual_data)}</div>` : ''}
          <div class="antwoorden" id="ant">
            ${(v.antwoorden || []).map(a => `<button class="antwoord-btn ${isVisueel ? 'locked' : ''}" data-idx="${a.idx}">${escHtml(a.tekst)}</button>`).join('')}
          </div>
          ${isVisueel ? `<div class="denk-timer" id="denk-timer">⏳ Lees nog 1x door — antwoord-knoppen actief over <span id="denk-sec">10</span> sec</div>` : ''}
        </div>
      `;
      document.querySelectorAll('.antwoord-btn').forEach(b => b.addEventListener('click', () => kiesAntwoord(parseInt(b.dataset.idx))));

      // Anti-snelklik: bij visuele vragen pas na 10 sec antwoorden mogelijk
      if (isVisueel) {
        let secLeft = 10;
        const secEl = document.getElementById('denk-sec');
        const timerEl = document.getElementById('denk-timer');
        const iv = setInterval(() => {
          secLeft -= 1;
          if (secEl) secEl.textContent = secLeft;
          if (secLeft <= 0) {
            clearInterval(iv);
            document.querySelectorAll('.antwoord-btn').forEach(b => b.classList.remove('locked'));
            if (timerEl) {
              timerEl.classList.add('green');
              timerEl.textContent = '✅ Klaar — kies je antwoord';
              setTimeout(() => { if (timerEl) timerEl.style.opacity = '0.3'; }, 1500);
            }
          }
        }, 1000);
      }
    }

    async function kiesAntwoord(idx) {
      const tijd = Math.round((Date.now() - state.huidigeVraagStart) / 1000);
      // disable knoppen
      document.querySelectorAll('.antwoord-btn').forEach(b => b.classList.add('disabled'));
      try {
        const r = await api('/poging', {
          method: 'POST',
          body: JSON.stringify({
            vraag_id: state.huidigeVraag.id,
            sessie_id: state.sessieId,
            gebruiker: 'miles',
            gekozen_antwoord_index: idx,
            tijd_seconden: tijd,
          }),
        });
        state.vragenGedaan.push({ id: state.huidigeVraag.id, correct: r.correct });

        // Examen-modus: GEEN feedback per vraag, direct door naar volgende
        if (state.mode === 'examen') {
          state.examenAntwoorden.push({
            vraag: state.huidigeVraag,
            gekozen: idx,
            correct: r.correct,
            correct_index: r.correct_index,
            uitleg: r.uitleg,
            ezelsbruggetje: r.ezelsbruggetje,
          });
          // korte visuele bevestiging via originele idx (data-idx attribuut)
          const btn = document.querySelector(`.antwoord-btn[data-idx="${idx}"]`);
          btn?.classList.add(r.correct ? 'correct' : 'wrong');
          setTimeout(() => nextVraag(), 350);
          return;
        }

        // Sessie-modus + snap-modus: volledige feedback
        // Gebruik data-idx selectors want UI is geshuffled tov originele volgorde
        const correctBtn = document.querySelector(`.antwoord-btn[data-idx="${r.correct_index}"]`);
        correctBtn?.classList.add('correct');
        if (!r.correct) {
          const chosenBtn = document.querySelector(`.antwoord-btn[data-idx="${idx}"]`);
          chosenBtn?.classList.add('wrong');
        }

        const ant = document.getElementById('ant');
        const fb = document.createElement('div');
        fb.className = 'feedback';

        // Snap-mode: bij correct antwoord verplicht uitleggen voor 'volgende'
        const isSnapMode = state.mode === 'snap';
        const moetUitleggen = isSnapMode && r.correct;

        fb.innerHTML = `
          <div class="feedback-title">${r.correct ? '✅ ' + randomGood() : '❌ ' + randomBad()}</div>
          ${!moetUitleggen ? `<div class="feedback-uitleg">${escHtml(r.uitleg)}</div>` : ''}
          ${!moetUitleggen && r.ezelsbruggetje ? `<div class="ezelsbruggetje"><strong>🧠 Ezelsbruggetje:</strong> ${escHtml(r.ezelsbruggetje)}</div>` : ''}
          ${moetUitleggen ? `
            <div class="snap-box">
              <label>🧠 Snap-check: leg in 1 zin uit waarom dit goed is.</label>
              <textarea id="snap-uitleg" placeholder="Bv: rechts heeft voorrang op gelijkwaardig kruispunt..."></textarea>
              <button class="btn" style="margin-top:10px" id="btn-snap-submit">Check mijn snap →</button>
            </div>
          ` : `<button class="btn" style="margin-top:14px" id="btn-next">${state.vragenGedaan.length >= state.maxVragen ? 'Bekijk score →' : 'Volgende vraag →'}</button>`}
        `;
        ant.parentNode.insertBefore(fb, ant.nextSibling);

        if (moetUitleggen) {
          const submitBtn = document.getElementById('btn-snap-submit');
          submitBtn.addEventListener('click', async () => {
            const uitleg = document.getElementById('snap-uitleg').value.trim();
            if (uitleg.length < 5) { alert('Schrijf even iets meer'); return; }
            submitBtn.disabled = true;
            submitBtn.textContent = 'AI checkt...';
            try {
              const snap = await api('/snap-check', {
                method: 'POST',
                body: JSON.stringify({ vraag_id: state.huidigeVraag.id, uitleg_van_miles: uitleg }),
              });
              const cls = snap.score === 'snap' ? 'snap' : snap.score === 'twijfel' ? 'twijfel' : 'niet';
              const icon = snap.score === 'snap' ? '🎯' : snap.score === 'twijfel' ? '🤔' : '📚';
              const snapResult = document.createElement('div');
              snapResult.className = 'snap-result ' + cls;
              snapResult.innerHTML = `
                <div style="font-weight:700;margin-bottom:6px">${icon} ${snap.score === 'snap' ? 'Je snapt het!' : snap.score === 'twijfel' ? 'Bijna' : 'Nog niet helemaal'}</div>
                <div>${escHtml(snap.feedback || '')}</div>
                ${snap.tip ? `<div style="margin-top:8px;font-size:13px;opacity:0.9"><b>💡</b> ${escHtml(snap.tip)}</div>` : ''}
                <div style="margin-top:10px;font-size:13px;opacity:0.85"><b>Officieel:</b> ${escHtml(r.uitleg)}</div>
              `;
              fb.appendChild(snapResult);
              const nextBtn = document.createElement('button');
              nextBtn.className = 'btn';
              nextBtn.style.marginTop = '14px';
              nextBtn.textContent = state.vragenGedaan.length >= state.maxVragen ? 'Bekijk score →' : 'Volgende vraag →';
              nextBtn.addEventListener('click', nextVraag);
              fb.appendChild(nextBtn);
            } catch (err) {
              alert('Oeps, snap-check faalde: ' + err.message);
              submitBtn.disabled = false;
              submitBtn.textContent = 'Check mijn snap →';
            }
          });
        } else {
          document.getElementById('btn-next').addEventListener('click', nextVraag);
        }
      } catch (e) {
        alert('Oeps: ' + e.message);
      }
    }

    function randomGood() {
      const opts = ['Die zat 💪', 'Wallah goed', 'Vet, klopt', 'Yes bro', 'Sterk werk', 'Skill 🔥', 'Op niveau', 'Doen we beter dan een Tesla', 'Op punt'];
      return opts[Math.floor(Math.random()*opts.length)];
    }
    function randomBad() {
      const opts = ['Ouleh, nee', 'Bijna', 'Wack, mis', 'Mis bro', 'Nope', 'Nog niet', 'Anders', 'Hmm, mis'];
      return opts[Math.floor(Math.random()*opts.length)];
    }

    async function finishSessie(reason) {
      clearTimer();
      const duur = Math.round((Date.now() - state.sessieStart) / 1000);

      const correct = state.vragenGedaan.filter(v => v.correct).length;
      const totaal = state.vragenGedaan.length;
      const fout = totaal - correct;
      const pct = totaal > 0 ? Math.round((correct/totaal)*100) : 0;

      // Examen-modus: CBR-stijl resultaat met review
      if (state.mode === 'examen') {
        const cbrSlaag = fout <= 7;
        const emoji = cbrSlaag ? '🎓' : '📚';
        const txt = cbrSlaag ? 'GESLAAGD! 🎉' : 'Niet gehaald — nog door oefenen';
        const fouteAntwoorden = state.examenAntwoorden.filter(a => !a.correct);

        app.innerHTML = `
          <div class="header">
            <div class="logo">🎓 Examen-resultaat</div>
            <div class="streak">🔥 ${state.streak}</div>
          </div>
          <div class="summary screen">
            <div class="summary-emoji">${emoji}</div>
            <h1 style="${cbrSlaag ? 'color:#00E676' : ''}">${txt}</h1>
            <div class="summary-score ${cbrSlaag ? 'score-high' : 'score-low'}">${fout}<span style="font-size:32px;opacity:0.6"> fout</span></div>
            <p><b>${correct}/${totaal} goed</b> in ${Math.floor(duur/60)}:${String(duur%60).padStart(2,'0')}</p>
            <p>CBR slaaggrens: max 7 fouten</p>
            ${cbrSlaag ? '<p style="color:#00E676;font-weight:700;font-size:18px">Op het echte examen zou je dit nu halen 💪</p>' : `<p style="opacity:0.85">Nog ${fout - 7} fouten te veel. Bekijk hieronder wat fout ging.</p>`}
          </div>

          ${fouteAntwoorden.length > 0 ? `
            <h2 style="margin-top:30px">📝 Fouten review (${fouteAntwoorden.length})</h2>
            <div id="fouten-list">
              ${fouteAntwoorden.map((a, i) => `
                <div class="card" style="margin-bottom:10px">
                  <div style="font-weight:700;font-size:14px;margin-bottom:8px;opacity:0.85">Vraag ${i+1}</div>
                  <div style="font-size:14px;line-height:1.45;margin-bottom:10px">${highlightKernwoorden(a.vraag.vraag)}</div>
                  <div style="font-size:13px;margin-bottom:6px"><span style="color:#FF5252">✗ Jij koos:</span> ${escHtml(a.vraag.antwoorden[a.gekozen].tekst)}</div>
                  <div style="font-size:13px;margin-bottom:10px"><span style="color:#00E676">✓ Goed was:</span> ${escHtml(a.vraag.antwoorden[a.correct_index].tekst)}</div>
                  <div style="font-size:13px;opacity:0.85;line-height:1.4">${escHtml(a.uitleg)}</div>
                  ${a.ezelsbruggetje ? `<div class="ezelsbruggetje" style="margin-top:8px;font-size:13px"><strong>🧠</strong> ${escHtml(a.ezelsbruggetje)}</div>` : ''}
                </div>
              `).join('')}
            </div>
          ` : ''}

          <div style="margin-top:30px">
            <button class="btn" id="btn-again-examen">Nog een examen →</button>
            <button class="btn btn-secondary" id="btn-home">Terug naar menu</button>
          </div>
        `;
        document.getElementById('btn-again-examen').addEventListener('click', () => startSessie('mix', 'examen'));
        document.getElementById('btn-home').addEventListener('click', renderStart);
        return;
      }

      // Normale sessie-modus
      const cbrPct = pct >= 86;
      const emoji = pct >= 90 ? '🏆' : pct >= 86 ? '🎯' : pct >= 70 ? '💪' : pct >= 50 ? '🤔' : '😅';
      const txt = pct >= 90 ? 'Wallah, scherp!' : pct >= 86 ? 'CBR-niveau! Door zo!' : pct >= 70 ? 'Goed bezig, nog wat scherper' : pct >= 50 ? 'Kan beter, blijf doen' : 'Ouleh, doe een 2e ronde';

      app.innerHTML = `
        <div class="header">
          <div class="logo">🛵 Theorie Sidekick</div>
          <div class="streak">🔥 ${state.streak}</div>
        </div>
        <div class="summary screen">
          <div class="summary-emoji">${emoji}</div>
          <h1>${txt}</h1>
          <div class="summary-score ${cbrPct ? 'score-high' : pct >= 70 ? 'score-mid' : 'score-low'}">${pct}%</div>
          <p>${correct} van ${totaal} goed in ${Math.floor(duur/60)}:${String(duur%60).padStart(2,'0')}</p>
          ${reason === 'time' ? `<p class="small">Timer verlopen — geen stress.</p>` : ''}
          ${cbrPct ? `<p style="color:#00E676;font-weight:600">${pct}% is boven de CBR slaaggrens van 86% 🎉</p>` : `<p class="small">CBR slaaggrens: 86% (max 7 fouten op 50). Door blijven oefenen!</p>`}
          <div style="margin-top:30px">

            <button class="btn btn-secondary" id="btn-home">Terug naar menu</button>

      document.getElementById('btn-again').addEventListener('click', () => startSessie(state.categorie, 'sessie'));
      document.getElementById('btn-home').addEventListener('click', renderStart);

    function renderVisual(type, data) {
      data = data || {};
      if (type === 'sign') return renderSignSvg(data);
      if (type === 'intersection') return renderIntersectionSvg(data);
      if (type === 'road') return renderRoadSvg(data);
      return '';
    }

    function renderSignSvg(data) {
      const code = (data.sign_code || '').toUpperCase();
      const lbl = data.label || '';
      // Eenvoudige representatie per type
      if (code === 'B1' || code.includes('VOORRANGSWEG')) {
        return `<svg viewBox="0 0 100 100" width="180" height="180"><polygon points="50,5 95,50 50,95 5,50" fill="#fff" stroke="#000" stroke-width="3"/><polygon points="50,15 85,50 50,85 15,50" fill="#FFD700" stroke="#fff" stroke-width="3"/></svg>`;
      }
      if (code === 'B2') {
        return `<svg viewBox="0 0 100 100" width="180" height="180"><polygon points="50,5 95,50 50,95 5,50" fill="#fff" stroke="#000" stroke-width="3"/><polygon points="50,15 85,50 50,85 15,50" fill="#FFD700" stroke="#fff" stroke-width="3"/><line x1="15" y1="85" x2="85" y2="15" stroke="#000" stroke-width="5"/></svg>`;
      }
      if (code === 'C1' || code === 'C2') {
        return `<svg viewBox="0 0 100 100" width="180" height="180"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="50" cy="50" r="42" fill="#D32F2F"/><rect x="20" y="44" width="60" height="12" fill="#fff"/></svg>`;
      }
      if (code === 'C12') {
        return `<svg viewBox="0 0 100 100" width="180" height="180"><circle cx="50" cy="50" r="42" fill="#fff"/><circle cx="50" cy="50" r="42" fill="none" stroke="#D32F2F" stroke-width="10"/><text x="50" y="65" font-size="50" text-anchor="middle">🛵</text></svg>`;
      }
      if (code === 'A1' || (code.includes('A') && data.label?.toLowerCase().includes('max'))) {
        const num = (lbl.match(/\d+/) || ['50'])[0];
        return `<svg viewBox="0 0 100 100" width="180" height="180"><circle cx="50" cy="50" r="42" fill="#fff"/><circle cx="50" cy="50" r="42" fill="none" stroke="#D32F2F" stroke-width="10"/><text x="50" y="65" font-size="36" font-weight="bold" text-anchor="middle" fill="#000">${num}</text></svg>`;
      }
      if (code === 'A4') {
        const num = (lbl.match(/\d+/) || ['30'])[0];
        return `<svg viewBox="0 0 100 100" width="180" height="180"><rect x="10" y="10" width="80" height="80" fill="#0066CC" rx="6"/><text x="50" y="65" font-size="36" font-weight="bold" text-anchor="middle" fill="#fff">${num}</text></svg>`;
      }
      if (code === 'J1') {
        return `<svg viewBox="0 0 100 100" width="180" height="180"><polygon points="50,8 92,82 8,82" fill="#fff" stroke="#D32F2F" stroke-width="6"/><text x="50" y="68" font-size="30" font-weight="bold" text-anchor="middle">✕</text></svg>`;
      }
      if (code === 'J2') {
        return `<svg viewBox="0 0 100 100" width="180" height="180"><polygon points="50,8 92,82 8,82" fill="#fff" stroke="#D32F2F" stroke-width="6"/><path d="M 35 65 Q 35 30 65 30 L 60 25 M 65 30 L 60 35" stroke="#000" stroke-width="3" fill="none"/></svg>`;
      }
      if (code === 'D4') {
        return `<svg viewBox="0 0 100 100" width="180" height="180"><circle cx="50" cy="50" r="42" fill="#0066CC"/><path d="M 50 25 L 50 75 M 50 25 L 40 35 M 50 25 L 60 35" stroke="#fff" stroke-width="6" fill="none"/></svg>`;
      }
      if (code === 'G11' || code === 'G12A' || code.startsWith('G1')) {
        return `<svg viewBox="0 0 100 100" width="180" height="180"><circle cx="50" cy="50" r="42" fill="#0066CC"/><text x="50" y="65" font-size="44" text-anchor="middle">🚲</text></svg>`;
      }
      if (code === 'G5' || code === 'G7') {
        return `<svg viewBox="0 0 100 100" width="180" height="180"><rect x="6" y="6" width="88" height="88" fill="#0066CC" rx="4"/><text x="50" y="65" font-size="40" text-anchor="middle">🚶</text></svg>`;
      }
      if (code === 'E1' || code === 'E2') {
        const isX = code === 'E2';
        return `<svg viewBox="0 0 100 100" width="180" height="180"><circle cx="50" cy="50" r="42" fill="#0066CC"/><circle cx="50" cy="50" r="42" fill="none" stroke="#D32F2F" stroke-width="10"/>${isX ? '<line x1="22" y1="22" x2="78" y2="78" stroke="#D32F2F" stroke-width="8"/><line x1="78" y1="22" x2="22" y2="78" stroke="#D32F2F" stroke-width="8"/>' : '<line x1="22" y1="78" x2="78" y2="22" stroke="#D32F2F" stroke-width="8"/>'}</svg>`;

      }
      // Fallback
      return `<div style="text-align:center"><div style="font-size:54px">🚧</div><div style="opacity:0.7;margin-top:8px;font-size:13px">${escHtml(lbl)}</div></div>`;
    }

    function renderIntersectionSvg(data) {
      const type = data.type || 'cross';
      const me = data.me || 'from_bottom';

      if (type === 'cross') {
        const others = data.other || [];
        let elems = '';
        others.forEach(o => {
          const color = o.vehicle === 'bike' ? '#FFC107' : o.vehicle === 'tram' ? '#9C27B0' : '#1976D2';
          const ico = o.vehicle === 'bike' ? '🚲' : o.vehicle === 'tram' ? '🚋' : '🚗';
          if (o.from === 'right') elems += `<text x="160" y="100" font-size="28" text-anchor="middle">${ico}</text><path d="M 145 100 L 110 100" stroke="${color}" stroke-width="3" marker-end="url(#arrow)"/>`;
          else if (o.from === 'left') elems += `<text x="40" y="100" font-size="28" text-anchor="middle">${ico}</text><path d="M 55 100 L 90 100" stroke="${color}" stroke-width="3" marker-end="url(#arrow)"/>`;
          else if (o.from === 'top') elems += `<text x="100" y="40" font-size="28" text-anchor="middle">${ico}</text><path d="M 100 55 L 100 90" stroke="${color}" stroke-width="3" marker-end="url(#arrow)"/>`;
        });
        return `<svg viewBox="0 0 200 200" width="240" height="240"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#fff"/></marker></defs><rect width="200" height="200" fill="#2a3144" rx="6"/><rect x="80" y="0" width="40" height="200" fill="#555"/><rect x="0" y="80" width="200" height="40" fill="#555"/><line x1="100" y1="0" x2="100" y2="80" stroke="#fff" stroke-width="1" stroke-dasharray="4,4"/><line x1="100" y1="120" x2="100" y2="200" stroke="#fff" stroke-width="1" stroke-dasharray="4,4"/><line x1="0" y1="100" x2="80" y2="100" stroke="#fff" stroke-width="1" stroke-dasharray="4,4"/><line x1="120" y1="100" x2="200" y2="100" stroke="#fff" stroke-width="1" stroke-dasharray="4,4"/><text x="100" y="170" font-size="32" text-anchor="middle">🛵</text><path d="M 100 145 L 100 110" stroke="#FF6B35" stroke-width="3" marker-end="url(#arrow)"/>${elems}</svg>`;
      }

      if (type === 'roundabout') {
        return `<svg viewBox="0 0 200 200" width="240" height="240"><rect width="200" height="200" fill="#2a3144" rx="6"/><rect x="80" y="0" width="40" height="200" fill="#555"/><rect x="0" y="80" width="200" height="40" fill="#555"/><circle cx="100" cy="100" r="55" fill="#2a3144"/><circle cx="100" cy="100" r="55" fill="none" stroke="#fff" stroke-width="3"/><text x="135" y="105" font-size="20">🚗</text><text x="100" y="175" font-size="28" text-anchor="middle">🛵</text></svg>`;
      }

      return `<div style="text-align:center;font-size:48px;opacity:0.6">🚧</div>`;
    }

    function renderRoadSvg(data) {
      const scene = data.scene || '';
      if (data.marking === 'sharkteeth') {
        return `<svg viewBox="0 0 200 100" width="280" height="140"><rect width="200" height="100" fill="#555"/><line x1="0" y1="50" x2="200" y2="50" stroke="#fff" stroke-width="1" stroke-dasharray="4,4"/><polygon points="40,40 50,55 60,40" fill="#fff"/><polygon points="70,40 80,55 90,40" fill="#fff"/><polygon points="100,40 110,55 120,40" fill="#fff"/><polygon points="130,40 140,55 150,40" fill="#fff"/><text x="100" y="85" font-size="14" fill="#fff" text-anchor="middle">▼ jouw kant ▼</text></svg>`;
      }
      // Generic road scene
      const emojis = {
        zebra_pedestrian_crossing: '🚶🦓',
        blind_person_crossing: '🦯',
        school_zone_children: '🏫👦',
        ambulance_behind: '🚑',
        bus_at_stop_signaling: '🚌',
        car_reversing_from_parking: '🚗⏪',
        leaving_driveway: '🚪🛵',
        officer_intersection: '👮',
        yellow_line_parking: '🟨🚫',
        broken_yellow_line: '🟡',
        overtaking_bike_on_bikepath: '🚲←🛵',
        approaching_intersection_no_overtake: '🚦🚫',
        rural_road_with_bikepath: '🌾🛵',
        city_road_brommer_position: '🏙️🛵',
        road_with_bikestrip: '🚲🛣️',
        solid_white_line_center: '━━━',
        starting_from_parking: '🅿️🛵',
      };
      const ico = emojis[scene] || '🚧';
      return `<div style="text-align:center"><div style="font-size:64px">${ico}</div></div>`;
    }

    // Service worker registreren voor PWA install
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    renderStart();
  </script>
</body>
